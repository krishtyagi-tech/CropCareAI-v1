<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 180">

<defs>

<radialGradient id="core">
    <stop offset="0%" stop-color="#fffde7"/>
    <stop offset="45%" stop-color="#ffd54f"/>
    <stop offset="80%" stop-color="#ff9800"/>
    <stop offset="100%" stop-color="#ef6c00"/>
</radialGradient>

<filter id="glow">

    <feGaussianBlur
        stdDeviation="6"
        result="coloredBlur"/>

    <feMerge>

        <feMergeNode in="coloredBlur"/>

        <feMergeNode in="SourceGraphic"/>

    </feMerge>

</filter>

</defs>

<path
id="flame"

filter="url(#glow)"

fill="url(#core)"

d="
M60 165
C28 145 18 110 30 82
C36 66 47 55 53 37
C58 22 55 12 60 0
C65 12 62 22 67 37
C73 55 84 66 90 82
C102 110 92 145 60 165
Z"/>

</svg>